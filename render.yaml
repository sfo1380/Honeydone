# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the Honeydone web app and its Postgres database on Render's free plans.
# Free web services sleep after ~15 minutes idle; free databases expire after 30 days.
services:
  - type: web
    name: honeydone
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    # Migrations run on start because pre-deploy commands aren't available on the free plan.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: honeydone-db
          property: connectionString

databases:
  - name: honeydone-db
    plan: free
    databaseName: honeydone
